<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" defer src="/index.ts"></script>
    <link rel="manifest" href="/.well-known/manifest.webmanifest" />
</head>

<body>
    <main class="container">
        <div><progress id="loading" /></div>
        <h2 class="draggable">Unframed IWA Demo</h2>
        <h4>Path: /unframed/window</h4>
        <p>
            This window <span class="bold">is</span>
            <span class="hidden-in-unframed bold">not</span> unframed
        </p>
        <p>
            Window management permission state:
            <span id="permission-state" class="bold">UNKNOWNS</span>
        </p>
        <button id="permission-prompt">Prompt permission</button>
        <p style="margin-top: 1rem">
            The button below opens a regular window.
        </p>
        <a role="button" href="/" target="_blank"> Open window </a>
        <p style="margin-top: 2rem"></p>
        <a role="button" href="/"> Navigate to / </a>
        <p style="margin-top: 2rem"></p>
        <button id="close-window-button">Close this window</button>
    </main>
</body>

</html>
